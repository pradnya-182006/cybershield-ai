<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CyberShield AI{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="glow g1"></div><div class="glow g2"></div>
  <nav class="nav">
    <a href="/" class="brand"><span class="logo">🛡️</span> CyberShield <b>AI</b></a>
    <div class="links">
      <a href="/" class="{{ 'active' if request.path == '/' }}">Home</a>
      <a href="/analyzer" class="{{ 'active' if request.path == '/analyzer' }}">Analyzer</a>
      <a href="/dashboard" class="{{ 'active' if request.path == '/dashboard' }}">Dashboard</a>
    </div>
    <button id="themeBtn" class="icon-btn" aria-label="Toggle theme">🌙</button>
  </nav>

  <main>{% block content %}{% endblock %}</main>

  <footer class="footer">
    CyberShield AI - Smart Cyberbullying Detection &amp; Prevention System Using NLP
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
